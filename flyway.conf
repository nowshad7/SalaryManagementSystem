# PaySQL :: Flyway configuration
#
# Secrets are NOT stored here. Set the password via the FLYWAY_PASSWORD
# environment variable (or override any value below with FLYWAY_* env vars).
#
# Example:
#   export FLYWAY_PASSWORD=change-me
#   flyway migrate

flyway.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
flyway.user=paysql

# Schema PaySQL manages.
flyway.schemas=PAYSQL
flyway.defaultSchema=PAYSQL

# Migration locations.
#   db/migrations      -> schema (always applied)
#   db/seed            -> optional demo data (remove this line for production)
flyway.locations=filesystem:db/migrations,filesystem:db/seed
