name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify project scaffolding
        run: |
          set -e
          for f in LICENSE README.md CONTRIBUTING.md AGENTS.md llms.txt docs/PROPOSAL.md mkdocs.yml; do
            test -f "$f" || { echo "::error::Missing required file: $f"; exit 1; }
          done
          echo "Scaffolding OK."

